<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I miei ordini — TECH4LESS</title>
<link rel="stylesheet" href="<[base]>/assets/css/style.css">
</head>
<body>

<[header]>

<main class="container" style="padding:48px 0; max-width:720px;">
  <h1>I miei ordini</h1>

  <[if!empty messaggio_vuoto]>
  <p style="color:var(--signal); margin-top:20px;"><[messaggio_vuoto]></p>
  <[/if!empty]>

  <div style="margin-top:24px;">
    <[foreach]>
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); padding:16px 0;">
      <div>
        <div class="card-title" style="margin-bottom:4px;"><[numero_ordine]></div>
        <div class="sku"><[data_ordine]> — <[stato_label]></div>
      </div>
      <div class="price"><[totale]></div>
    </div>
    <[/foreach]>
  </div>
</main>

<[footer]>
</body>
</html>
