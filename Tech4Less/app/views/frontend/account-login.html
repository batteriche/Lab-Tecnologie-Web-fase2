<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accedi — TECH4LESS</title>
<link rel="stylesheet" href="<[base]>/assets/css/style.css">
</head>
<body>

<[header]>

<main class="container" style="padding:56px 0; max-width:420px;">
  <h1>Accedi</h1>

  <form method="post" action="<[base]>/account/login" style="margin-top:24px; display:grid; gap:14px;">
    <input type="hidden" name="csrf_token" value="<[csrf_token]>">
    <input type="email" name="email" placeholder="Email" required style="padding:11px; border:1px solid var(--line); border-radius:3px; background:var(--surface); color:var(--ink);">
    <input type="password" name="password" placeholder="Password" required style="padding:11px; border:1px solid var(--line); border-radius:3px; background:var(--surface); color:var(--ink);">
    <button type="submit" class="btn btn-primary">Accedi</button>
  </form>

  <p style="margin-top:20px; color:var(--ink-soft); font-size:0.9rem;">
    Non hai un account? <a href="<[base]>/account/registrati" style="color:var(--copper);">Registrati</a>
  </p>
</main>

<[footer]>
</body>
</html>
