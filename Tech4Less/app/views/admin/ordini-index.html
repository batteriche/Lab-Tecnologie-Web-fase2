<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordini — Admin TECH4LESS</title>
<link rel="stylesheet" href="<[base]>/assets/css/style.css">
<link rel="stylesheet" href="<[base]>/assets/css/admin.css">
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar"><[sidebar]></aside>
  <main class="admin-main">
    <[topbar]>

    <table class="admin-table">
      <thead><tr><th>Numero</th><th>Cliente</th><th>Stato</th><th>Data</th><th>Totale</th><th></th></tr></thead>
      <tbody>
      <[foreach]>
        <tr>
          <td class="num"><[numero_ordine]></td>
          <td><[cliente]></td>
          <td><span class="status-pill <[stato]>"><[stato]></span></td>
          <td><[data_ordine]></td>
          <td class="num"><[totale]></td>
          <td><a href="<[b_ordini]>/admin/ordini/<[id]>" class="action-link">Dettaglio →</a></td>
        </tr>
      <[/foreach]>
      </tbody>
    </table>
  </main>
</div>
</body>
</html>
