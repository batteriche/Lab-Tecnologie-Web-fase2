<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Utenti — Admin TECH4LESS</title>
<link rel="stylesheet" href="<[base]>/assets/css/style.css">
<link rel="stylesheet" href="<[base]>/assets/css/admin.css">
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar"><[sidebar]></aside>
  <main class="admin-main">
    <[topbar]>

    <table class="admin-table">
      <thead><tr><th>Nome</th><th>Username</th><th>Email</th><th>Gruppi</th><th>Stato</th><th></th></tr></thead>
      <tbody>
      <[foreach]>
        <tr>
          <td><[nome]></td>
          <td class="num"><[username]></td>
          <td><[email]></td>
          <td><[gruppi]></td>
          <td><span class="status-pill <[stato]>"><[stato]></span></td>
          <td><a href="<[b_utenti]>/admin/utenti/<[id]>/gruppi" class="action-link">Modifica gruppi</a></td>
        </tr>
      <[/foreach]>
      </tbody>
    </table>
  </main>
</div>
</body>
</html>
